<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cairn — a quiet time tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    /* Brand palette */
    --eggshell:        #f4f1de;
    --burnt-peach:     #e07a5f;
    --twilight-indigo: #3d405b;
    --muted-teal:      #81b29a;
    --apricot-cream:   #f2cc8f;

    /* Semantic — light */
    --bg:        #ece8d3;
    --bg-soft:   #f4f1de;
    --surface:   #fbf9ee;
    --surface-2: #f4f1de;
    --ink:       #3d405b;
    --ink-soft:  rgba(61, 64, 91, .66);
    --ink-mute:  rgba(61, 64, 91, .42);
    --ink-faint: rgba(61, 64, 91, .18);
    --hairline:  rgba(61, 64, 91, .12);
    --hairline-strong: rgba(61, 64, 91, .22);
    --accent:    var(--burnt-peach);
    --accent-soft: rgba(224, 122, 95, .14);
    --teal:      var(--muted-teal);
    --teal-soft: rgba(129, 178, 154, .18);
    --apricot:   var(--apricot-cream);
    --apricot-soft: rgba(242, 204, 143, .35);
    --indigo:    var(--twilight-indigo);
    --indigo-soft: rgba(61, 64, 91, .08);
    --shadow-soft:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 14px 40px -16px rgba(34, 28, 50, .35),
      0 4px 14px -8px rgba(34, 28, 50, .2);

    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 6px;

    /* Density (overridden by tweak) */
    --pad-x: 24px;
    --pad-y: 22px;
    --gap:   22px;
    --row-h: 46px;
    --font-base: 16px;
    --font-small: 14px;
    --font-tiny: 12.5px;
    --font-display: 42px;
    --line-base: 1.55;

    /* Type system */
    --serif: "Newsreader", ui-serif, Georgia, serif;
    --sans:  "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:  "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  [data-theme="dark"] {
    --bg:        #1b1d29;
    --bg-soft:   #232636;
    --surface:   #262a3c;
    --surface-2: #2e3245;
    --ink:       #f4f1de;
    --ink-soft:  rgba(244, 241, 222, .72);
    --ink-mute:  rgba(244, 241, 222, .46);
    --ink-faint: rgba(244, 241, 222, .18);
    --hairline:  rgba(244, 241, 222, .10);
    --hairline-strong: rgba(244, 241, 222, .20);
    --accent-soft: rgba(224, 122, 95, .22);
    --teal-soft:  rgba(129, 178, 154, .22);
    --apricot-soft: rgba(242, 204, 143, .22);
    --indigo-soft: rgba(244, 241, 222, .08);
    --shadow-soft:
      0 1px 0 rgba(255,255,255,.04) inset,
      0 14px 40px -16px rgba(0, 0, 0, .55),
      0 4px 14px -8px rgba(0, 0, 0, .4);
  }

  /* Density variants applied to popover root */
  .pop[data-density="compact"] {
    --pad-x: 18px;
    --pad-y: 16px;
    --gap:   16px;
    --row-h: 38px;
    --font-base: 14.5px;
    --font-small: 13px;
    --font-tiny: 11.5px;
    --font-display: 34px;
    --line-base: 1.5;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--sans);
    background: #d5d0bb;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  /* ─────────── DESKTOP SCENE ─────────── */
  .scene {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120% 70% at 30% -10%, #ece6cc 0%, transparent 60%),
      radial-gradient(80% 60% at 90% 110%, #c7c0a3 0%, transparent 60%),
      linear-gradient(180deg, #e3ddc4 0%, #cbc6ad 100%);
  }
  [data-theme="dark"] .scene {
    background:
      radial-gradient(120% 70% at 30% -10%, #2a2c40 0%, transparent 60%),
      radial-gradient(80% 60% at 90% 110%, #15172a 0%, transparent 60%),
      linear-gradient(180deg, #1d1f2c 0%, #131420 100%);
  }
  .scene::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, rgba(61,64,91,.07), transparent 40%),
      radial-gradient(1.5px 1.5px at 78% 64%, rgba(61,64,91,.06), transparent 40%),
      radial-gradient(1.5px 1.5px at 41% 81%, rgba(61,64,91,.05), transparent 40%),
      radial-gradient(1.5px 1.5px at 88% 30%, rgba(61,64,91,.05), transparent 40%);
    pointer-events: none;
  }

  /* Faint background type — set the mood */
  .scene-quote {
    position: absolute;
    bottom: 8vh;
    left: 6vw;
    right: 6vw;
    max-width: 600px;
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(20px, 2.6vw, 32px);
    line-height: 1.35;
    color: rgba(61, 64, 91, .14);
    pointer-events: none;
    user-select: none;
  }
  [data-theme="dark"] .scene-quote { color: rgba(244, 241, 222, .07); }
  .scene-quote .q-attr {
    display: block;
    font-style: normal;
    font-family: var(--sans);
    font-size: .42em;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: .8;
  }

  /* macOS-style menu bar */
  .menubar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 28px;
    background: rgba(251, 249, 238, .72);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border-bottom: .5px solid rgba(61, 64, 91, .14);
    display: flex;
    align-items: center;
    padding: 0 14px;
    font-size: 13px;
    color: var(--ink);
    z-index: 10;
  }
  [data-theme="dark"] .menubar {
    background: rgba(28, 29, 41, .72);
    border-bottom-color: rgba(244, 241, 222, .12);
  }
  .menubar .mb-apple { font-size: 14px; margin-right: 16px; opacity: .85; }
  .menubar .mb-app   { font-weight: 600; margin-right: 16px; }
  .menubar .mb-item  { font-weight: 400; margin-right: 14px; opacity: .82; }
  .menubar .mb-right {
    margin-left: auto;
    display: flex; align-items: center; gap: 14px;
    opacity: .9;
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
  }
  .mb-tracker {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 1px 8px 2px;
    border-radius: 5px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 500;
    font-size: 12px;
    position: relative;
  }
  .mb-tracker::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(224, 122, 95, .22);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(224, 122, 95, .22); }
    50%      { box-shadow: 0 0 0 5px rgba(224, 122, 95, .08); }
  }
  @media (prefers-reduced-motion: reduce) {
    .mb-tracker::before { animation: none; }
  }
  .mb-time { color: var(--ink); }
  .mb-icons { display: inline-flex; gap: 8px; color: var(--ink-soft); }
</style>

<style>
/* styles.css — Cairn popover */

/* ─── POPOVER FRAME ─────────────────────────────────────────────────── */
.pop {
  position: absolute;
  top: 36px;
  right: 26px;
  width: 500px;
  font-size: var(--font-base);
  line-height: var(--line-base, 1.5);
  max-height: calc(100vh - 56px);
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: .5px solid var(--hairline-strong);
  box-shadow: var(--shadow-soft);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 20;
  isolation: isolate;
}
.pop[data-density="compact"] { width: 420px; }
.pop::before {
  /* Tail pointing up to tray icon */
  content: "";
  position: absolute;
  top: -7px;
  right: 38px;
  width: 14px;
  height: 14px;
  background: var(--surface);
  border-top: .5px solid var(--hairline-strong);
  border-left: .5px solid var(--hairline-strong);
  transform: rotate(45deg);
  z-index: 1;
}

/* ─── POPOVER HEADER ────────────────────────────────────────────────── */
.pop-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px var(--pad-x);
  border-bottom: .5px solid var(--hairline);
  position: relative;
  z-index: 2;
  background: var(--surface);
}
.pop-head .brand {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 500;
  letter-spacing: .005em;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--ink);
}
.pop-head .brand-mark {
  display: inline-block;
  width: 14px; height: 14px;
  position: relative;
}
.pop-head .brand-mark::before,
.pop-head .brand-mark::after {
  content: "";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 1px;
}
.pop-head .brand-mark::before { /* large bottom stone */
  bottom: 0; width: 12px; height: 5px;
  background: var(--ink); opacity: .9;
}
.pop-head .brand-mark::after  { /* small top stone */
  top: 0; width: 7px; height: 4px;
  background: var(--accent);
}
.pop-head .brand-mark .mid {
  position: absolute;
  left: 50%; top: 5px;
  transform: translateX(-50%);
  width: 9px; height: 4px;
  background: var(--ink); opacity: .55;
  border-radius: 1px;
}
.pop-head .spacer { flex: 1; }

.pop-head-actions {
  display: flex; align-items: center; gap: 4px;
}
.icon-btn {
  appearance: none;
  border: 0; background: transparent;
  width: 26px; height: 26px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 6px;
  color: var(--ink-soft);
  cursor: default;
}
.icon-btn:hover { background: var(--indigo-soft); color: var(--ink); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ─── NAV TABS ──────────────────────────────────────────────────────── */
.pop-nav {
  display: flex;
  gap: 4px;
  padding: 6px var(--pad-x) 0;
  border-bottom: .5px solid var(--hairline);
}
.pop-nav-btn {
  appearance: none;
  border: 0; background: transparent;
  font: inherit;
  font-size: var(--font-small);
  font-weight: 500;
  color: var(--ink-mute);
  padding: 10px 12px 12px;
  border-bottom: 1.5px solid transparent;
  margin-bottom: -.5px;
  cursor: default;
  display: inline-flex; align-items: center; gap: 5px;
  letter-spacing: .005em;
}
.pop-nav-btn:hover { color: var(--ink); }
.pop-nav-btn.is-on {
  color: var(--ink);
  border-bottom-color: var(--ink);
}
.pop-nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.pop-nav .nav-spacer { flex: 1; }
.pop-nav .nav-meta {
  font-size: var(--font-tiny);
  color: var(--ink-mute);
  align-self: center;
  padding-bottom: 8px;
  font-variant-numeric: tabular-nums;
}

/* ─── POPOVER BODY ──────────────────────────────────────────────────── */
.pop-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--ink-faint) transparent;
}
.pop-body::-webkit-scrollbar { width: 8px; }
.pop-body::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }

.view {
  padding: var(--pad-y) var(--pad-x) calc(var(--pad-y) + 6px);
  display: flex; flex-direction: column;
  gap: var(--gap);
  font-size: var(--font-base);
  line-height: var(--line-base, 1.5);
}

/* ─── SECTION LABEL ─────────────────────────────────────────────────── */
.sect-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: var(--font-tiny);
  font-weight: 600;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 10px;
}
.sect-label .sect-meta {
  font-weight: 400;
  letter-spacing: .02em;
  text-transform: none;
  font-variant-numeric: tabular-nums;
}

/* ─── SUGGESTION BANNER ─────────────────────────────────────────────── */
.suggest {
  background: linear-gradient(180deg, var(--apricot-soft) 0%, rgba(242, 204, 143, .12) 100%);
  border: .5px solid rgba(242, 204, 143, .55);
  border-radius: var(--radius-md);
  padding: 14px 16px 14px;
  position: relative;
}
[data-theme="dark"] .suggest {
  background: linear-gradient(180deg, rgba(242, 204, 143, .14), rgba(242, 204, 143, .04));
  border-color: rgba(242, 204, 143, .25);
}
.suggest-head {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--font-tiny);
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 8px;
}
.suggest-head svg { color: var(--accent); }
.suggest-x {
  appearance: none; border: 0; background: transparent;
  position: absolute; top: 6px; right: 6px;
  width: 20px; height: 20px; border-radius: 5px;
  color: var(--ink-mute); cursor: default;
  display: inline-flex; align-items: center; justify-content: center;
}
.suggest-x:hover { background: var(--indigo-soft); color: var(--ink); }
.suggest-body {
  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.4;
  color: var(--ink);
}
.suggest-body em { font-style: italic; }
.suggest-why {
  font-size: var(--font-tiny);
  color: var(--ink-mute);
  margin-top: 8px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
  line-height: 1.5;
}
.suggest-why code {
  font-family: var(--mono);
  font-size: 12px;
  background: rgba(61, 64, 91, .06);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--ink-soft);
}
.suggest-link {
  appearance: none; border: 0; background: transparent;
  font: inherit; font-size: var(--font-tiny);
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: default;
  padding: 0; margin-left: auto;
}
.suggest-actions {
  display: flex; gap: 8px; margin-top: 14px;
}

/* ─── IDLE PANEL ────────────────────────────────────────────────────── */
.idle {
  background: var(--indigo-soft);
  border: .5px solid var(--hairline-strong);
  border-radius: var(--radius-md);
  padding: 14px 16px 15px;
}
.idle-head {
  display: flex; align-items: center; gap: 6px;
  font-size: var(--font-small);
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
}
.idle-body {
  font-family: var(--serif);
  font-size: 16px;
  color: var(--ink-soft);
  display: flex; align-items: baseline; gap: 8px;
  margin-bottom: 9px;
}
.idle-body strong { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.idle-dur {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--ink-mute);
}
.idle-actions { display: flex; gap: 6px; }

/* ─── BUTTONS ───────────────────────────────────────────────────────── */
.btn {
  appearance: none;
  border: .5px solid transparent;
  background: transparent;
  font: inherit;
  font-size: var(--font-small);
  font-weight: 500;
  color: var(--ink);
  padding: 6px 11px;
  border-radius: 7px;
  display: inline-flex; align-items: center; gap: 5px;
  cursor: default;
  line-height: 1;
  transition: background .12s ease, border-color .12s ease;
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn--primary {
  background: var(--ink);
  color: var(--bg-soft);
  border-color: var(--ink);
}
.btn--primary:hover { background: rgba(61, 64, 91, .9); }
[data-theme="dark"] .btn--primary { background: var(--eggshell); color: var(--indigo); border-color: var(--eggshell); }
.btn--ghost {
  background: transparent;
  border-color: var(--hairline-strong);
  color: var(--ink-soft);
}
.btn--ghost:hover { background: var(--indigo-soft); color: var(--ink); }
.btn--stop {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  font-weight: 500;
}
.btn--stop:hover { filter: brightness(.96); }
.btn--sm { padding: 4px 8px; font-size: var(--font-tiny); }

.link-btn {
  appearance: none; border: 0; background: transparent;
  font: inherit; font-size: var(--font-tiny);
  color: var(--ink-soft);
  text-decoration: underline;
  text-underline-offset: 2px;
  text-decoration-color: var(--ink-faint);
  cursor: default;
  padding: 0;
}
.link-btn:hover { color: var(--accent); text-decoration-color: var(--accent); }
.link-btn--danger:hover { color: #b14a31; text-decoration-color: #b14a31; }

/* ─── RUNNING TIMER ─────────────────────────────────────────────────── */
.now {
  background: var(--bg-soft);
  border: .5px solid var(--hairline);
  border-radius: var(--radius-md);
  padding: 16px 18px 16px;
}
.now-meta {
  display: flex; align-items: center; justify-content: space-between;
  font-size: var(--font-tiny);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 4px;
}
.now-label { font-weight: 600; }
.now-source {
  display: inline-flex; align-items: center; gap: 3px;
  text-transform: none;
  letter-spacing: 0;
  font-size: 12px;
  color: var(--accent);
  font-weight: 500;
}
.now-time {
  font-family: var(--serif);
  font-size: var(--font-display);
  font-weight: 400;
  font-feature-settings: "lnum", "tnum";
  letter-spacing: -.01em;
  color: var(--ink);
  line-height: 1.05;
  margin: 6px 0 12px;
}
.now-time .t-sep { color: var(--ink-mute); margin: 0 1px; }
.now-task { margin-bottom: 12px; }
.now-input {
  width: 100%;
  border: 0;
  background: transparent;
  font: inherit;
  font-family: var(--serif);
  font-size: 17px;
  color: var(--ink);
  padding: 6px 0 7px;
  border-bottom: 1px dashed var(--hairline-strong);
}
.now-input:focus {
  outline: 0;
  border-bottom-style: solid;
  border-bottom-color: var(--accent);
}
.now-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.now-chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* ─── PROJECT CHIPS + TAGS ──────────────────────────────────────────── */
.proj-chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: var(--font-small);
  color: var(--ink);
  padding: 2px 7px 2px 6px;
  border-radius: 999px;
  background: rgba(61, 64, 91, .06);
  line-height: 1.5;
  white-space: nowrap;
}
[data-theme="dark"] .proj-chip { background: rgba(244, 241, 222, .06); }
.proj-chip.is-interactive { cursor: default; }
.proj-chip.is-interactive:hover { background: rgba(61, 64, 91, .1); }
.proj-chip--lg { font-size: 14px; padding: 3px 9px 3px 8px; }
.proj-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

.tag {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-mute);
  letter-spacing: .01em;
}

.kbd {
  font-family: var(--mono);
  font-size: 12px;
  background: var(--surface-2);
  border: .5px solid var(--hairline-strong);
  border-bottom-width: 1px;
  border-radius: 4px;
  padding: 1px 5px;
  color: var(--ink-soft);
  margin: 0 1px;
}

/* ─── LOCAL BADGE ───────────────────────────────────────────────────── */
.local-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px;
  font-weight: 500;
  color: var(--teal);
  background: var(--teal-soft);
  padding: 2px 7px 2px 6px;
  border-radius: 999px;
  letter-spacing: .02em;
}
.local-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 0 3px rgba(129, 178, 154, .25);
}

/* ─── QUICK START (layout variant) ──────────────────────────────────── */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}
.quick-card {
  appearance: none;
  border: .5px solid var(--hairline);
  background: var(--bg-soft);
  font: inherit;
  font-size: var(--font-small);
  color: var(--ink);
  padding: 8px 10px;
  border-radius: 8px;
  display: flex; align-items: center; gap: 7px;
  cursor: default;
  text-align: left;
}
.quick-card:hover { border-color: var(--hairline-strong); background: var(--surface-2); }
.quick-name { font-weight: 500; }

/* ─── DAY TIMELINE ──────────────────────────────────────────────────── */
.dt-wrap { padding: 0 2px; }
.dt-track {
  position: relative;
  height: 26px;
  background: linear-gradient(180deg, rgba(61, 64, 91, .04), rgba(61, 64, 91, .07));
  border-radius: 5px;
  overflow: visible;
}
[data-theme="dark"] .dt-track { background: linear-gradient(180deg, rgba(244, 241, 222, .04), rgba(244, 241, 222, .07)); }
.dt-seg {
  position: absolute;
  top: 0; bottom: 0;
  border-radius: 3px;
  opacity: .9;
}
.dt-seg.is-running {
  background: repeating-linear-gradient(
    -45deg,
    var(--accent) 0 6px,
    color-mix(in oklab, var(--accent) 75%, white) 6px 12px
  ) !important;
  animation: stripe-shift 6s linear infinite;
}
@keyframes stripe-shift { to { background-position: 36px 0; } }
.dt-now {
  position: absolute;
  top: -4px; bottom: -4px;
  width: 1.5px;
  background: var(--ink);
}
.dt-now::before {
  content: "";
  position: absolute;
  top: -3px; left: 50%;
  transform: translateX(-50%);
  width: 7px; height: 7px;
  background: var(--ink);
  border-radius: 50%;
}
.dt-now-label {
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 13px;
  color: var(--ink);
  background: var(--surface);
  padding: 0 3px;
  white-space: nowrap;
}
.dt-axis {
  position: relative;
  height: 14px;
  margin-top: 4px;
}
.dt-tick {
  position: absolute;
  top: 0;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 13px;
  color: var(--ink-mute);
}
.legend {
  display: flex; flex-wrap: wrap; gap: 10px;
  margin-top: 10px;
  font-size: 12px;
  color: var(--ink-soft);
}
.legend-item { display: inline-flex; align-items: center; gap: 5px; }

/* ─── ENTRY LIST ────────────────────────────────────────────────────── */
.entries { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.entry {
  display: grid;
  grid-template-columns: 44px 8px 1fr auto 14px;
  align-items: center;
  gap: 10px;
  font-size: var(--font-small);
  padding: 7px 6px 7px 2px;
  border-radius: 6px;
}
.entry:hover { background: var(--indigo-soft); }
.entry-time { font-family: var(--mono); font-size: 12.5px; color: var(--ink-mute); }
.entry-task { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry-dur  { font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.entry-src  { color: var(--ink-mute); }

/* ─── UPCOMING ──────────────────────────────────────────────────────── */
.up-list { list-style: none; margin: 0; padding: 0; }
.up-item {
  display: grid;
  grid-template-columns: 48px 1fr auto;
  align-items: baseline;
  gap: 12px;
  font-size: var(--font-small);
  padding: 8px 0;
  border-top: .5px dashed var(--hairline);
  color: var(--ink-soft);
}
.up-time { font-family: var(--mono); font-size: 12.5px; color: var(--ink-mute); }
.up-label { color: var(--ink); }
.up-dur { font-family: var(--mono); font-size: 12px; color: var(--ink-mute); }

/* ─── VIEW HEADER ───────────────────────────────────────────────────── */
.view-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
}
.view-title {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 500;
  margin: 0;
  letter-spacing: -.005em;
  color: var(--ink);
  line-height: 1.15;
}
.view-sub {
  font-size: var(--font-small);
  color: var(--ink-mute);
  margin: 4px 0 0;
  line-height: 1.5;
}
.rep-big {
  font-family: var(--serif);
  font-size: 30px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.rep-unit { font-size: 16px; color: var(--ink-soft); margin-left: 1px; }
.rep-delta { font-size: var(--font-small); color: var(--teal); font-weight: 500; }

/* Segmented control */
.seg {
  display: inline-flex;
  border: .5px solid var(--hairline-strong);
  border-radius: 7px;
  padding: 2px;
  background: var(--bg-soft);
}
.seg-btn {
  appearance: none; border: 0; background: transparent;
  font: inherit; font-size: var(--font-tiny); font-weight: 500;
  color: var(--ink-mute);
  padding: 4px 9px;
  border-radius: 5px;
  cursor: default;
  letter-spacing: .01em;
}
.seg-btn:hover { color: var(--ink); }
.seg-btn.is-on {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(61, 64, 91, .08);
}
.seg--sm .seg-btn { padding: 3px 7px; }

/* ─── REPORTS CHART ─────────────────────────────────────────────────── */
.chart-grid {
  position: relative;
  height: 160px;
  margin-top: 6px;
  padding-left: 18px;
}
.chart-line {
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  background: var(--hairline);
  pointer-events: none;
}
.chart-axis {
  position: absolute;
  left: -2px;
  top: -7px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--ink-mute);
}
.chart-bars {
  position: relative;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  align-items: end;
  gap: 8px;
}
.bar-col {
  position: relative;
  height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: end;
}
.bar-stack {
  width: 70%;
  max-width: 28px;
  display: flex;
  flex-direction: column-reverse;
  gap: 1.5px;
  border-radius: 3px 3px 1px 1px;
  overflow: hidden;
  position: relative;
}
.bar-seg {
  width: 100%;
  min-height: 2px;
  opacity: .92;
}
.bar-label {
  position: absolute;
  bottom: -28px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-mute);
  letter-spacing: .03em;
}
.bar-hours {
  position: absolute;
  bottom: -42px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
.bar-col.is-today .bar-stack { box-shadow: 0 0 0 1.5px var(--ink) inset; border-radius: 4px 4px 1px 1px; }
.bar-col.is-today .bar-label { color: var(--ink); font-weight: 600; }
.bar-col.is-future { opacity: .35; }

.chart {
  padding-bottom: 50px;
}

/* ─── BREAKDOWN LIST ────────────────────────────────────────────────── */
.brk-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.brk-row {
  display: grid;
  grid-template-columns: 130px 1fr 42px 38px;
  align-items: center;
  gap: 10px;
  font-size: var(--font-small);
  padding: 4px 0;
}
.brk-name { display: flex; align-items: center; gap: 6px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brk-bar {
  height: 6px;
  background: rgba(61, 64, 91, .07);
  border-radius: 3px;
  position: relative;
  overflow: hidden;
}
[data-theme="dark"] .brk-bar { background: rgba(244, 241, 222, .08); }
.brk-fill {
  position: absolute;
  inset: 0 auto 0 0;
  border-radius: 3px;
  opacity: .9;
}
.brk-hours { font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums; }
.brk-pct { font-family: var(--mono); font-size: 12px; color: var(--ink-mute); text-align: right; font-variant-numeric: tabular-nums; }

/* ─── HONESTY METER ─────────────────────────────────────────────────── */
.honesty-bar {
  display: flex;
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  background: var(--bg-soft);
  gap: 1px;
}
.hon-seg {
  display: block;
  height: 100%;
  font-size: 0; /* hide text inside bar */
}
.hon-rule   { background: var(--burnt-peach); }
.hon-cal    { background: var(--muted-teal); }
.hon-manual { background: var(--twilight-indigo); opacity: .6; }
.hon-legend {
  list-style: none; margin: 8px 0 0; padding: 0;
  display: flex; flex-wrap: wrap; gap: 10px 14px;
  font-size: 12px;
  color: var(--ink-soft);
}
.hon-legend li { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.hon-key { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.hon-key.hon-rule   { background: var(--burnt-peach); }
.hon-key.hon-cal    { background: var(--muted-teal); }
.hon-key.hon-manual { background: var(--twilight-indigo); opacity: .6; }

/* ─── RULES VIEW ────────────────────────────────────────────────────── */
.signals {
  background: var(--bg-soft);
  border: .5px solid var(--hairline);
  border-radius: var(--radius-md);
  padding: 10px 12px;
}
.sig-list { list-style: none; margin: 0; padding: 0; }
.sig-item {
  display: grid;
  grid-template-columns: 14px 110px 1fr auto;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  padding: 3px 0;
  color: var(--ink-soft);
}
.sig-label { color: var(--ink-mute); font-size: var(--font-tiny); letter-spacing: .03em; text-transform: uppercase; font-weight: 600; }
.sig-value { font-family: var(--mono); font-size: 12px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sig-src   { font-size: 12px; color: var(--ink-mute); }
.sig-ic    { color: var(--ink-mute); }

.rule-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rule {
  border: .5px solid var(--hairline);
  border-radius: var(--radius-md);
  background: var(--surface);
  transition: border-color .12s ease;
}
.rule:hover { border-color: var(--hairline-strong); }
.rule.is-off { opacity: .55; }
.rule.is-open { border-color: var(--hairline-strong); background: var(--bg-soft); }
.rule-head {
  display: grid;
  grid-template-columns: 14px 18px 1fr auto 56px 32px 12px;
  align-items: center;
  gap: 10px;
  padding: 12px 12px;
  cursor: default;
}
.rule-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--radius-md); }
.rule-drag { color: var(--ink-faint); }
.rule:hover .rule-drag { color: var(--ink-mute); }
.rule-num {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-mute);
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.rule-name {
  font-size: var(--font-small);
  font-weight: 500;
  color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rule-summary {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px;
  color: var(--ink-mute);
  overflow: hidden;
}
.rule-multi {
  font-size: 12px;
  background: var(--indigo-soft);
  color: var(--ink-soft);
  padding: 1px 6px;
  border-radius: 3px;
}
.rule-arrow { color: var(--ink-faint); flex-shrink: 0; }
.rule-stats {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-mute);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.rule-tags-only { font-size: 12px; color: var(--ink-mute); font-style: italic; }
.rule-chev { color: var(--ink-mute); }

/* Switch */
.rule-toggle input {
  appearance: none;
  width: 26px; height: 14px;
  border-radius: 999px;
  background: var(--ink-faint);
  position: relative;
  cursor: default;
  margin: 0;
  transition: background .15s ease;
}
.rule-toggle input::before {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--surface);
  transition: transform .15s ease;
}
.rule-toggle input:checked { background: var(--muted-teal); }
.rule-toggle input:checked::before { transform: translateX(12px); }
.rule-toggle input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Rule body */
.rule-body {
  padding: 0 12px 12px;
  border-top: .5px dashed var(--hairline-strong);
  display: flex; flex-direction: column; gap: 12px;
  padding-top: 12px;
  margin-top: 2px;
}
.rule-when, .rule-then, .rule-meta {
  display: flex; flex-direction: column; gap: 6px;
}
.cond {
  display: grid;
  grid-template-columns: 14px 96px 96px 1fr 16px;
  align-items: center;
  gap: 6px;
  position: relative;
  padding-top: 4px;
}
.cond-join {
  position: absolute;
  top: -10px; left: 14px;
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: .1em;
  color: var(--ink-mute);
  background: var(--bg-soft);
  padding: 0 4px;
}
.cond-sig { font-size: 12px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.cond-op, .cond-val {
  font: inherit;
  font-size: var(--font-tiny);
  background: var(--surface);
  border: .5px solid var(--hairline);
  border-radius: 5px;
  padding: 4px 6px;
  color: var(--ink);
  font-family: var(--mono);
}
.cond-op { font-family: var(--sans); }
.cond-val:focus, .cond-op:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.cond-x {
  appearance: none; border: 0; background: transparent;
  width: 18px; height: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 4px;
  color: var(--ink-mute); cursor: default;
}
.cond-x:hover { background: var(--indigo-soft); color: var(--ink); }
.add-cond {
  appearance: none; border: 0; background: transparent;
  font: inherit; font-size: var(--font-tiny);
  color: var(--ink-mute);
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 0;
  cursor: default;
  align-self: flex-start;
}
.add-cond:hover { color: var(--accent); }

.then-row {
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 8px;
  align-items: center;
}
.then-key {
  font-size: 12px;
  color: var(--ink-mute);
  text-transform: uppercase;
  letter-spacing: .06em;
  font-weight: 600;
}
.then-val {
  font: inherit;
  font-size: var(--font-tiny);
  background: var(--surface);
  border: .5px solid var(--hairline);
  border-radius: 5px;
  padding: 4px 6px;
  color: var(--ink);
}
.then-tags { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.add-tag {
  appearance: none; border: .5px dashed var(--hairline-strong); background: transparent;
  font: inherit; font-size: 12px;
  color: var(--ink-mute);
  padding: 2px 7px;
  border-radius: 999px;
  cursor: default;
}
.add-tag:hover { border-style: solid; border-color: var(--accent); color: var(--accent); }
.then-note { font-size: 12.5px; color: var(--ink-mute); font-style: italic; }

.rule-meta-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-soft); }
.rule-conf, .rule-amb { color: var(--ink); font-family: var(--mono); font-size: 12px; }

.rule-foot { display: flex; gap: 12px; padding-top: 6px; border-top: .5px dashed var(--hairline); }

.cond-pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px;
  color: var(--ink-soft);
  background: var(--indigo-soft);
  padding: 2px 6px;
  border-radius: 4px;
  max-width: 220px;
  overflow: hidden;
}
.cond-pill-sig { font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-mute); }
.cond-pill-op { color: var(--ink-mute); font-size: 13px; }
.cond-pill code { font-family: var(--mono); font-size: 12px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80px; }

/* Test bench */
.test-bench {
  background: var(--bg-soft);
  border: .5px dashed var(--hairline-strong);
  border-radius: var(--radius-md);
  padding: 12px;
}
.bench-inputs { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.bench-field { display: grid; grid-template-columns: 100px 1fr; align-items: center; gap: 8px; }
.bench-label { font-size: 12px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.bench-input {
  font: inherit; font-family: var(--mono); font-size: 12.5px;
  background: var(--surface);
  border: .5px solid var(--hairline);
  border-radius: 5px;
  padding: 4px 6px;
  color: var(--ink);
}
.bench-result {
  display: flex; flex-wrap: wrap; align-items: center; gap: 5px;
  font-size: var(--font-small);
  color: var(--ink-soft);
  padding-top: 8px;
  border-top: .5px dashed var(--hairline);
}
.bench-result strong { color: var(--ink); font-weight: 600; }
.bench-arrow { color: var(--accent); }
.bench-tags { display: inline-flex; gap: 4px; margin-left: auto; }

/* ─── SETTINGS ──────────────────────────────────────────────────────── */
.privacy-card {
  background: linear-gradient(180deg, var(--teal-soft) 0%, rgba(129, 178, 154, .04) 100%);
  border: .5px solid rgba(129, 178, 154, .4);
  border-radius: var(--radius-md);
  padding: 18px 18px 16px;
}
[data-theme="dark"] .privacy-card { border-color: rgba(129, 178, 154, .25); }
.privacy-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.privacy-head svg { color: var(--teal); }
.privacy-title {
  font-family: var(--serif);
  font-size: 21px;
  font-weight: 500;
  margin: 0;
  color: var(--ink);
}
.privacy-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.privacy-list li {
  display: flex; align-items: flex-start; gap: 9px;
  font-size: var(--font-small);
  color: var(--ink-soft);
  padding: 4px 0;
  line-height: 1.5;
}
.privacy-list svg { color: var(--teal); flex-shrink: 0; margin-top: 3px; }
.privacy-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

.settings-block {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.settings-h {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 500;
  margin: 8px 0 2px;
  color: var(--ink);
}
.settings-sub {
  font-size: var(--font-tiny);
  color: var(--ink-mute);
  margin: 0 0 10px;
  line-height: 1.5;
}

.excl-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.excl-row {
  display: grid;
  grid-template-columns: 14px 1fr auto 18px;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 6px;
  background: var(--bg-soft);
  font-size: var(--font-small);
}
.excl-row code { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
.excl-kind { font-size: 12px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.excl-x {
  appearance: none; border: 0; background: transparent;
  width: 18px; height: 18px;
  border-radius: 4px;
  color: var(--ink-mute); cursor: default;
  display: inline-flex; align-items: center; justify-content: center;
}
.excl-x:hover { background: var(--indigo-soft); color: var(--accent); }
.excl-add { background: transparent; border: .5px dashed var(--hairline-strong); }
.excl-add input {
  border: 0; background: transparent; font: inherit; font-size: var(--font-small);
  color: var(--ink); width: 100%;
}
.excl-add input::placeholder { color: var(--ink-mute); }
.excl-add input:focus { outline: 0; }

.settings-check {
  display: flex; align-items: center; gap: 8px;
  font-size: var(--font-small);
  color: var(--ink-soft);
  margin-top: 4px;
}
.settings-check input { accent-color: var(--accent); }

.set-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 11px 0;
  border-top: .5px solid var(--hairline);
}
.set-row:first-of-type { border-top: 0; }
.set-row-label { font-size: var(--font-small); color: var(--ink); line-height: 1.45; }
.set-row-hint { font-size: var(--font-tiny); color: var(--ink-mute); margin-top: 3px; line-height: 1.45; }

/* iOS-style toggle */
.tgl {
  appearance: none; border: 0;
  width: 32px; height: 18px;
  border-radius: 999px;
  background: var(--ink-faint);
  position: relative;
  cursor: default;
  padding: 0;
  transition: background .15s ease;
}
.tgl-dot {
  position: absolute;
  top: 2px; left: 2px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--surface);
  transition: transform .15s ease;
  box-shadow: 0 1px 2px rgba(0,0,0,.18);
}
.tgl.is-on { background: var(--accent); }
.tgl.is-on .tgl-dot { transform: translateX(14px); }
.tgl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.short-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
.short-list li {
  display: flex; justify-content: space-between; align-items: center;
  font-size: var(--font-small);
  padding: 9px 0;
  border-top: .5px solid var(--hairline);
  color: var(--ink-soft);
}
.short-list li:first-child { border-top: 0; }
.kbds { display: inline-flex; align-items: center; gap: 2px; }

.intg-list { list-style: none; margin: 0; padding: 0; }
.intg-row {
  display: grid;
  grid-template-columns: 18px 100px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-top: .5px solid var(--hairline);
  font-size: var(--font-small);
}
.intg-row:first-child { border-top: 0; }
.intg-name { color: var(--ink); font-weight: 500; }
.intg-status { color: var(--ink-mute); font-size: var(--font-tiny); }

.settings-foot {
  font-size: 12px;
  color: var(--ink-mute);
  text-align: center;
  padding-top: 10px;
  margin: 4px 0 0;
}
.settings-foot a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px dotted var(--hairline-strong); }
.settings-foot a:hover { color: var(--accent); border-bottom-color: var(--accent); }

/* ─── FOOTER (status strip) ─────────────────────────────────────────── */
.pop-foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px var(--pad-x) 10px;
  border-top: .5px solid var(--hairline);
  background: var(--bg-soft);
  font-size: 12.5px;
  color: var(--ink-mute);
  gap: 10px;
}
.pop-foot .foot-left, .pop-foot .foot-right {
  display: inline-flex; align-items: center; gap: 8px;
}
.pop-foot .foot-sep { width: 1px; height: 9px; background: var(--ink-faint); display: inline-block; }

/* ─── A11y ──────────────────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  .menubar .mb-tray-icon::after,
  .dt-seg.is-running { animation: none !important; }
}

</style>
</head>
<body data-theme="light">

  <!-- Desktop scene -->
  <div class="scene"></div>

  <p class="scene-quote">
    “How we spend our days is, of course, how we spend our lives.”
    <span class="q-attr">— Annie Dillard</span>
  </p>

  <div class="menubar" role="banner" aria-label="macOS menu bar (mock)">
    <span class="mb-apple"></span>
    <span class="mb-app">Cairn</span>
    <span class="mb-item">File</span>
    <span class="mb-item">Edit</span>
    <span class="mb-item">View</span>
    <span class="mb-item">Window</span>
    <span class="mb-item">Help</span>
    <span class="mb-right">
      <span class="mb-tracker" id="mb-tracker" aria-live="polite">
        <span id="mb-elapsed">0:14:00</span>
        <span> · Cairn</span>
      </span>
      <span class="mb-icons" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 4l-7 7h4v9h6v-9h4z"/></svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M22 11h-4"/></svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8l10 6 10-6"/><rect x="2" y="5" width="20" height="14" rx="2"/></svg>
      </span>
      <span class="mb-time" id="mb-clock">Thu Mar 14 · 3:02 PM</span>
    </span>
  </div>

  <!-- App mount -->
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="common.jsx"></script>
  <script type="text/babel" src="today.jsx"></script>
  <script type="text/babel" src="rules.jsx"></script>
  <script type="text/babel" src="reports.jsx"></script>
  <script type="text/babel" src="settings.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "dark",
      "density": "comfy",
      "layoutVariant": "default",
      "ruleComplexity": "medium",
      "ruleStyle": "cards",
      "showSuggestion": true,
      "showIdle": false
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [view, setView] = useState("today");
      const [openRuleId, setOpenRuleId] = useState(null);
      const [suggestionDismissed, setSuggestionDismissed] = useState(!t.showSuggestion);
      const [showIdleModal, setShowIdleModal] = useState(t.showIdle);

      // Reset state when tweaks toggle
      useEffect(() => { setSuggestionDismissed(!t.showSuggestion); }, [t.showSuggestion]);
      useEffect(() => { setShowIdleModal(t.showIdle); }, [t.showIdle]);

      // Apply theme to document
      useEffect(() => {
        document.body.dataset.theme = t.theme;
      }, [t.theme]);

      // Keyboard shortcuts: 1-4 switches views
      useEffect(() => {
        const onKey = (e) => {
          if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
          if (e.key === "1") setView("today");
          if (e.key === "2") setView("reports");
          if (e.key === "3") setView("rules");
          if (e.key === "4") setView("settings");
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, []);

      const openRule = (id) => {
        setOpenRuleId(id);
        setView("rules");
      };

      return (
        <>
          <div className="pop" data-density={t.density} role="dialog" aria-label="Cairn time tracker">
            {/* Header */}
            <header className="pop-head">
              <span className="brand">
                <span className="brand-mark" aria-hidden="true"><span className="mid" /></span>
                Cairn
              </span>
              <LocalBadge />
              <span className="spacer" />
              <div className="pop-head-actions">
                <button className="icon-btn" aria-label="Search" title="Search (⌘K)"><Icon name="search" /></button>
                <button className="icon-btn" aria-label="Add manual entry" title="Add entry"><Icon name="plus" /></button>
              </div>
            </header>

            {/* Tabs */}
            <nav className="pop-nav" role="tablist" aria-label="Cairn views">
              <button
                role="tab"
                aria-selected={view === "today"}
                className={`pop-nav-btn${view === "today" ? " is-on" : ""}`}
                onClick={() => setView("today")}
              >
                <Icon name="today" size={13} /> Today
              </button>
              <button
                role="tab"
                aria-selected={view === "reports"}
                className={`pop-nav-btn${view === "reports" ? " is-on" : ""}`}
                onClick={() => setView("reports")}
              >
                <Icon name="reports" size={13} /> Reports
              </button>
              <button
                role="tab"
                aria-selected={view === "rules"}
                className={`pop-nav-btn${view === "rules" ? " is-on" : ""}`}
                onClick={() => setView("rules")}
              >
                <Icon name="rules" size={13} /> Rules
              </button>
              <button
                role="tab"
                aria-selected={view === "settings"}
                className={`pop-nav-btn${view === "settings" ? " is-on" : ""}`}
                onClick={() => setView("settings")}
              >
                <Icon name="settings" size={13} /> Settings
              </button>
              <span className="nav-spacer" />
              <span className="nav-meta">⌃⌥T</span>
            </nav>

            {/* Body */}
            <div className="pop-body" role="tabpanel">
              {view === "today"    && <TodayView
                density={t.density}
                layoutVariant={t.layoutVariant}
                onOpenRule={openRule}
                suggestionDismissed={suggestionDismissed}
                setSuggestionDismissed={setSuggestionDismissed}
                showIdleModal={showIdleModal}
                setShowIdleModal={setShowIdleModal}
              />}
              {view === "reports"  && <ReportsView density={t.density} />}
              {view === "rules"    && <RulesView complexity={t.ruleComplexity} openRuleId={openRuleId} onOpenRule={setOpenRuleId} density={t.density} />}
              {view === "settings" && <SettingsView density={t.density} />}
            </div>

            {/* Footer status */}
            <footer className="pop-foot">
              <span className="foot-left">
                <Icon name="check" size={11} /> 4h 12m today
                <span className="foot-sep" />
                <Icon name="sparkle" size={11} /> 3 rules active
              </span>
              <span className="foot-right">
                <span><Kbd>⌃</Kbd><Kbd>⌥</Kbd><Kbd>␣</Kbd> stop</span>
              </span>
            </footer>
          </div>

          {/* Tweaks panel */}
          <TweaksPanel title="Cairn — tweaks">
            <TweakSection label="Theme & density" />
            <TweakRadio
              label="Theme"
              value={t.theme}
              options={["light","dark"]}
              onChange={(v) => setTweak("theme", v)}
            />
            <TweakRadio
              label="Density"
              value={t.density}
              options={["compact","comfy"]}
              onChange={(v) => setTweak("density", v)}
            />

            <TweakSection label="Layout" />
            <TweakRadio
              label="Today layout"
              value={t.layoutVariant}
              options={["default","projects-first"]}
              onChange={(v) => setTweak("layoutVariant", v)}
            />

            <TweakSection label="Rules engine" />
            <TweakRadio
              label="Builder depth"
              value={t.ruleComplexity}
              options={["light","medium","heavy"]}
              onChange={(v) => setTweak("ruleComplexity", v)}
            />

            <TweakSection label="Try states" />
            <TweakToggle
              label="Auto-detect suggestion"
              value={t.showSuggestion}
              onChange={(v) => setTweak("showSuggestion", v)}
            />
            <TweakToggle
              label='"You were away" idle modal'
              value={t.showIdle}
              onChange={(v) => setTweak("showIdle", v)}
            />
          </TweaksPanel>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
