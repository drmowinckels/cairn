[package]
name = "cairn-browser-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native messaging host bridging Cairn browser extension → main app IPC socket"
publish = false

[[bin]]
name = "cairn-browser-host"
path = "src/main.rs"

# Mirror CI's `clippy -- -D warnings` so local `cargo clippy`/`cargo build`
# enforce the same gate. Item-level `#[allow(...)]` still overrides where a
# lint is deliberately suppressed.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
