coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 100%
        threshold: 0%
        informational: false

comment:
  layout: "header, diff, flags, components, files"
  behavior: default
  require_changes: false
  show_carryforward_flags: true

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: frontend
      paths:
        - src/
    - name: rust
      paths:
        - src-tauri/src/

component_management:
  individual_components:
    - component_id: frontend
      name: Frontend (TypeScript)
      paths:
        - src/**
    - component_id: rust
      name: Backend (Rust)
      paths:
        - src-tauri/src/**

ignore:
  - "src/**/*.test.*"
  - "src/**/*.spec.*"
  - "src/test-setup.ts"
  - "src/test-fixtures/**"
  - "src/main.tsx"
  - "src/vite-env.d.ts"
  - "src-tauri/target/**"
  - "src-tauri/gen/**"
  - "scripts/**"
  - "docs/**"
  # Tauri runtime entry-point — can't be unit-tested because
  # `tauri::Builder::default()…run(generate_context!())` requires a
  # real event loop. Coverage of `lib.rs::run()` is whatever
  # integration tests exercise via `mock_app`, which doesn't go
  # through the Builder. See M0 testing-infra discussion.
  - "src-tauri/src/lib.rs"
  # Tray menu / popover-window setup — same: Tauri-only wiring.
  - "src-tauri/src/tray.rs"
  - "src-tauri/src/popover.rs"
  # Test-only support module is exempt from coverage of itself.
  - "src-tauri/src/test_support.rs"
