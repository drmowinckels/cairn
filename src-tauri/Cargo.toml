[package]
name = "cairn"
version = "0.0.1"
description = "Local-first, signal-aware time tracker"
authors = ["Athanasia Mowinckel"]
license = "Apache-2.0"
repository = "https://github.com/drmowinckels/cairn"
edition = "2021"
default-run = "cairn"

[lib]
name = "cairn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Mirror CI's `clippy -- -D warnings` so local `cargo clippy`/`cargo build`
# enforce the same gate. Item-level `#[allow(...)]` still overrides where a
# lint is deliberately suppressed.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-positioner = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
user-idle = "0.6"
icalendar = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip", "brotli", "deflate"] }
url = "2"
percent-encoding = "2"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Encrypted-file fallback for calendar URL secrets when the OS keychain
# (Secret Service on Linux) is unavailable (#40). Documented downgrade —
# see docs/PRIVACY.md. XChaCha20-Poly1305 with a machine-id-derived key.
chacha20poly1305 = "0.10"
blake3 = "1"
machine-uid = "0.5"
getrandom = "0.2"
# Cross-platform filesystem watcher used by `signals::git_watcher`
# to detect `.git/HEAD` changes (branch switches, rebases). Uses
# FSEvents on macOS, inotify on Linux, ReadDirectoryChangesW on
# Windows. `macos_kqueue` feature disabled because the default
# FSEvents path is preferred.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
dirs = "5"
async-trait = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSArray"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[dev-dependencies]
tempfile = "3"
mockito = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# Enables `tauri::test::{mock_builder, mock_context, noop_assets, MockRuntime}`
# for the integration-test rig in `test_support`. Kept out of
# [dependencies] so the release binary doesn't carry the mock runtime,
# and target-gated off Windows because the `test` feature transitively
# pulls in `wry` / WebView2 bindings whose `WebView2Loader.dll`
# entry-point doesn't match the GitHub Actions Windows image — the test
# binary fails to load with `STATUS_ENTRYPOINT_NOT_FOUND`. Rig coverage
# still runs on macOS + Ubuntu, which is sufficient (these tests
# exercise OS-agnostic DB / IPC / rules paths).
[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }
